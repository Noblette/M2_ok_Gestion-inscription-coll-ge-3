apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecole-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecole-frontend
  template:
    metadata:
      labels:
        app: ecole-frontend
    spec:
      containers:
      - name: ecole-frontend
        image: gcr.io/ecole-kubernetes/ecole-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ecole-frontend-service
spec:
  selector:
    app: ecole-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
